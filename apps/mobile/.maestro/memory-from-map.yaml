# 지도를 길게 눌러 그 자리에 추억을 남긴다.
#
#   maestro test -e EMAIL="me-$(date +%s)@test.com" apps/mobile/.maestro/memory-from-map.yaml
appId: com.littlepieces.app
---
# 가입 → 커플 생성 → 추억 등록. 그 추억에는 좌표가 없으므로 지도는 빈 상태로 시작한다.
- runFlow: signup-to-memory.yaml

- tapOn: '지도'
- assertVisible: '아직 지도에 찍힌 추억이 없어요.'

# 일부러 안내 카드가 덮고 있는 자리를 겨눈다. 예전에는 그 카드가 pointerEvents 없이
# 깔려 있어 지도 상단의 터치를 통째로 먹었다. 아래쪽을 누르면 그 회귀를 못 잡는다.
- longPressOn:
    point: '50%,20%'

- assertVisible: '추억 남기기'
# 길게 누른 좌표가 파라미터를 타고 폼까지 왔다는 증거.
- assertVisible: '위치 -?\d+\.\d+, -?\d+\.\d+'

- tapOn: '예: 첫 데이트'
- inputText: '길게 눌러 남긴 곳'
# 키보드를 닫아야 버튼이 드러난다.
- tapOn: '추억 남기기'
- tapOn: '저장'

# 좌표가 붙었으므로 빈 상태 안내가 사라진다.
# 마커의 접근성 표현은 iOS(MapKit)와 Android(Google Maps)가 달라 라벨로 단정하지 않는다.
- extendedWaitUntil:
    notVisible: '아직 지도에 찍힌 추억이 없어요.'
    timeout: 15000
# 저장 직후 카메라가 방금 찍은 자리에 머무는지는 여기서 검증하지 못한다 — 화면 상태라
# 접근성 트리에 안 나온다. 손으로 확인한다.
