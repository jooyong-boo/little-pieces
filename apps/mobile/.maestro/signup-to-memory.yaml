# 회원가입 → 커플 생성 → 추억 등록까지, 앱에서 실제로 도는지 본다.
# 백엔드가 떠 있어야 한다: docker compose up -d db && pnpm api:dev
#
#   maestro test -e EMAIL="me-$(date +%s)@test.com" apps/mobile/.maestro/signup-to-memory.yaml
appId: com.littlepieces.app
---
- launchApp:
    clearState: true

# 커플이 연결되면 (app)이 마운트되며 알림 권한을 묻는다 — 의도한 시점이다.
# 시스템 팝업이라 다음 단계를 가리므로 먼저 치운다.
- runFlow:
    when:
      visible: '^허용$'
    commands:
      - tapOn: '^허용$'

# clearState는 iOS Keychain을 지우지 않아 이전 실행의 토큰이 남는다
# (재설치해도 로그인이 유지되는 실제 동작). 남아 있으면 먼저 로그아웃한다.
# 조건을 탭바로 잡는다. 타임라인 화면만 보면, 앱이 지도/설정 탭에 남아 있을 때
# 로그인 상태인데도 조건이 안 걸려 다음 단계가 깨진다.
- runFlow:
    when:
      visible: '설정'
    commands:
      - tapOn: '설정'
      - scrollUntilVisible:
          element:
            text: '로그아웃'
      - tapOn: '로그아웃'
- runFlow:
    when:
      visible: '둘만의 공간 만들기'
    commands:
      - tapOn: '로그아웃'

- assertVisible: '로그인'
- tapOn: '계정이 없으신가요? 회원가입'

- tapOn: '이메일'
- inputText: '${EMAIL}'
- tapOn: '비밀번호'
- inputText: 'password123'
- tapOn: '닉네임'
- inputText: '테스터'
# 키보드를 닫아야 버튼이 드러난다. 제목은 터치 핸들러가 없어 탭이 키보드 닫기로 간다.
- tapOn: '회원가입'
- tapOn: '가입하기'

# 커플이 없으면 온보딩으로 간다.
- assertVisible: '둘만의 공간 만들기'
- tapOn: '새로 만들기'

- tapOn: '예: 우리 둘'
- inputText: '우리'
# 키보드를 닫아야 버튼이 드러난다. 제목은 터치 핸들러가 없어 탭이 키보드 닫기로 간다.
- tapOn: '공간 만들기'
- tapOn: '만들기'

# 커플이 연결되면 (app)이 마운트되며 알림 권한을 묻는다 — 의도한 시점이다.
# 시스템 팝업이라 다음 단계를 가리므로 먼저 치운다.
- runFlow:
    when:
      visible: '^허용$'
    commands:
      - tapOn: '^허용$'

# 커플이 생기면 가드가 타임라인으로 옮겨준다.
- assertVisible: '우리의 조각들'
- assertVisible: '아직 기록된 추억이 없어요.'
# 파트너가 없는 동안 초대 코드 배너가 보인다.
- assertVisible: '상대를 기다리는 중이에요'

- tapOn: '+ 추가'
- assertVisible: '추억 남기기'
# 날짜는 네이티브 피커로 고른다. 값이 텍스트로 남는 것이 스크린리더의 유일한 접근 경로이자,
# 피커를 열지 않고도 확인할 수 있는 유일한 신호다. 피커 자체를 여는 스텝은 넣지 않는다 —
# 달력 UI가 iOS(SwiftUI)와 Android(Material3)로 완전히 달라 하나의 플로우로 못 몬다.
- assertVisible: '날짜 \d+년 \d+월 \d+일'
- tapOn: '예: 첫 데이트'
- inputText: '첫 산책'
- tapOn: '예: 성수동'
- inputText: '한강'
# 키보드를 닫아야 버튼이 드러난다. 제목은 터치 핸들러가 없어 탭이 키보드 닫기로 간다.
- tapOn: '추억 남기기'
- tapOn: '저장'

# 타임라인에 반영된다. 모달이 닫히고 목록이 다시 불려오기까지 잠깐 걸린다.
- extendedWaitUntil:
    visible: '.*첫 산책.*'
    timeout: 10000
# 행 전체가 접근성 요소 하나로 합쳐지므로 제목·장소·작성자를 한 번에 확인한다.
- assertVisible: '첫 산책, 한강, 테스터 기록'

# 행을 눌러 상세로 — Pressable이 아니면 여기서 멈춘다.
- tapOn: '첫 산책, 한강, 테스터 기록'
- assertVisible: '추억 수정'
- assertVisible: '테스터 기록'

# 상세는 탭바 위에 쌓이므로 먼저 빠져나온다.
# 작은 화면에서는 버튼이 접혀 있을 수 있다. 여기엔 키보드가 없어 스크롤이 안전하다.
- scrollUntilVisible:
    element:
      text: '뒤로'
- tapOn: '뒤로'
- tapOn: '설정'
- assertVisible: '초대 코드'
- assertVisible: '멤버'
- assertVisible: '테스터 (개설자)'
