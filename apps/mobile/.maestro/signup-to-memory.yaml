# 회원가입 → 커플 생성 → 추억 등록까지, 앱에서 실제로 도는지 본다.
# 백엔드가 떠 있어야 한다: docker compose up -d db && pnpm api:dev
#
#   maestro test apps/mobile/.maestro/signup-to-memory.yaml
appId: com.littlepieces.app
---
- launchApp:
    clearState: true

- assertVisible: '로그인'
- tapOn: '계정이 없으신가요? 회원가입'

- tapOn: '이메일'
- inputText: 'maestro-${maestro.startTime}@test.com'
- tapOn: '비밀번호'
- inputText: 'password123'
- tapOn: '닉네임'
- inputText: '테스터'
- hideKeyboard
- tapOn: '가입하기'

# 커플이 없으면 온보딩으로 간다.
- assertVisible: '둘만의 공간 만들기'
- tapOn: '새로 만들기'

- tapOn: '예: 우리 둘'
- inputText: '우리'
- hideKeyboard
- tapOn: '만들기'

# 커플이 생기면 가드가 타임라인으로 옮겨준다.
- assertVisible: '우리의 조각들'
- assertVisible: '아직 기록된 추억이 없어요.'
# 파트너가 없는 동안 초대 코드 배너가 보인다.
- assertVisible: '상대를 기다리는 중이에요'

- tapOn: '+ 추가'
- assertVisible: '추억 남기기'
- tapOn: '예: 첫 데이트'
- inputText: '첫 산책'
- tapOn: '예: 성수동'
- inputText: '한강'
- hideKeyboard
- tapOn: '저장'

# 타임라인에 반영된다.
- assertVisible: '첫 산책'
- assertVisible: '📍 한강'

# 행을 눌러 상세로 — Pressable이 아니면 여기서 멈춘다.
- tapOn: '첫 산책'
- assertVisible: '추억 수정'
- assertVisible: '테스터 기록'

- tapOn: '설정'
- assertVisible: '초대 코드'
