services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: little_pieces
    ports:
      # 5432는 다른 로컬 프로젝트가 쓰고 있을 수 있어 5433으로 뺐다.
      # 바꾸면 apps/api/.env의 DATABASE_URL도 같이 고쳐야 한다.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  # R2 대신 로컬에서 도는 S3 호환 저장소. 배포 시에는 env만 R2로 바꾼다.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # 버킷을 한 번 만들고 끝나는 일회성 컨테이너.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/little-pieces

volumes:
  db-data:
  minio-data:
