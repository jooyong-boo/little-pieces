name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx expo customize tsconfig.json
        working-directory: apps/mobile

      - run: pnpm --filter mobile run typecheck

      - run: pnpm --filter mobile run lint

      - run: pnpm --filter mobile run format:check

      - run: pnpm --filter mobile run test --ci

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: little_pieces
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/little_pieces
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 버전을 고정한다. prepare --check가 생성된 JSON을 비교하므로 CLI가 흐르면
      # 코드가 멀쩡해도 이 잡이 깨진다. apps/api/Cargo.toml의 sqlx와 맞춘다.
      - run: cargo install sqlx-cli --version '^0.9' --no-default-features --features postgres,rustls

      - run: sqlx migrate run
        working-directory: apps/api

      # .sqlx 오프라인 캐시가 낡으면 CI가 아니라 배포가 깨진다(Docker 빌드는
      # SQLX_OFFLINE=true라 캐시만 본다). 위 postgres 서비스는 갓 마이그레이션한
      # 빈 DB이므로, .sqlx도 같은 조건에서 뽑아야 한다 — 데이터가 쌓인 DB에서
      # 뽑으면 LEFT JOIN 컬럼의 nullable 추론이 갈려 여기서 실패한다.
      - run: cargo sqlx prepare --check
        working-directory: apps/api

      - run: cargo fmt --check
        working-directory: apps/api

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/api

      - run: cargo build
        working-directory: apps/api

      - run: cargo test
        working-directory: apps/api
